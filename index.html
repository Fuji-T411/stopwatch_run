<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>体育ストップウォッチ</title>
<style>
:root{--bg:#0e1a2b;--panel:#16263d;--deep:#0b1524;--line:#2c4466;--text:#fff;--sub:#a9bad1;--go:#22c55e;--goal:#ff7a1a;--stop:#e5484d;--blue:#38bdf8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;display:flex;flex-direction:column;height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);-webkit-user-select:none;user-select:none;touch-action:manipulation}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:14px;font-weight:800;color:#fff;background:var(--line);padding:8px 14px;min-height:48px}
button:active{transform:scale(.97)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button:disabled{opacity:.35;cursor:not-allowed}

header{flex:none;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 10px;background:var(--panel);border-bottom:2px solid var(--line)}
.evwrap{display:flex;align-items:center;gap:8px;flex:1 1 200px;min-width:0}
.evwrap label{font-weight:800;font-size:15px;white-space:nowrap}
#event{flex:1;min-width:0;font-size:20px;font-weight:800;padding:6px 10px;border-radius:12px;border:2px solid var(--line);background:var(--deep);user-select:text}
header .hb{font-size:15px;min-height:44px;padding:6px 12px}

main{flex:1;min-height:0;display:flex;flex-direction:column}
.ctl{flex:none;padding:8px 10px;background:var(--bg);border-bottom:2px solid var(--line);display:flex;flex-direction:column;gap:8px}
#timer{font-variant-numeric:tabular-nums;font-weight:900;text-align:center;line-height:1;font-size:min(22vw,13dvh);color:var(--blue);white-space:nowrap}
#timer.run{color:#fff}
.row{display:flex;gap:8px}
#start{flex:2;background:var(--go);color:#04210f;font-size:20px;min-height:56px}
#reset{flex:1;background:var(--stop);font-size:18px;min-height:56px}
#goal{width:100%;background:var(--goal);color:#2a1100;font-size:clamp(24px,7vw,48px);height:clamp(84px,17dvh,220px);border-radius:20px}

.log{flex:1;min-height:0;overflow-y:auto;padding:10px;-webkit-overflow-scrolling:touch}
h2{margin:6px 0 8px;font-size:17px}
.h2row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.h2row button{min-height:38px;font-size:13px;padding:4px 10px;background:transparent;border:2px solid var(--line);color:var(--sub)}
#pending{display:flex;flex-direction:column;gap:8px}
.pi{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:8px}
.pi .o{font-size:16px;font-weight:800;color:var(--goal);white-space:nowrap}
.pi .t{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums;flex:0 0 auto;min-width:5.2em}
.pi select{flex:1 1 150px;min-width:0;font-size:18px;padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--deep)}
.pi .reg{background:var(--go);color:#04210f;font-size:18px;flex:0 0 auto}
.pi .x{background:transparent;color:var(--sub);min-height:40px;padding:4px 10px;font-size:20px;margin-left:auto}
.empty{color:var(--sub);text-align:center;padding:14px;font-size:15px}
.tools{display:flex;gap:8px;margin-bottom:8px}
#copy{flex:1;background:var(--blue);color:#032033;font-size:16px}
#clear{background:var(--stop);font-size:15px}
.rec{display:grid;grid-template-columns:3.2em minmax(0,1fr) 2.4em minmax(0,1.2fr) 4.8em 2.4em;gap:4px;align-items:center;padding:7px 2px;border-bottom:1px solid var(--line);font-size:15px}
.rec>*{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.rec.h{color:var(--sub);font-size:13px;position:sticky;top:-10px;background:var(--bg);z-index:1}
.rec .tm{font-weight:900;font-size:17px;font-variant-numeric:tabular-nums;text-align:right}
.rec.un .tm::before{content:"●";color:var(--goal);font-size:10px;margin-right:3px}
.rec button{background:transparent;color:var(--sub);min-height:36px;padding:0;font-size:18px}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:12px;z-index:9}
.modal.on{display:flex}
.box{background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:16px;width:min(640px,100%);max-height:94dvh;overflow:auto}
.box textarea,.box input{width:100%;border-radius:12px;border:2px solid var(--line);background:var(--deep);padding:10px;font-size:17px;user-select:text}
.box textarea{height:40dvh;font-family:ui-monospace,monospace}
.box p{color:var(--sub);margin:4px 0 10px;font-size:14px;line-height:1.5}
.box .row{margin-top:12px}.box .row button{flex:1}
#askBox{width:min(440px,100%)}
#askMsg{color:var(--text);font-size:18px;font-weight:700;margin:4px 0 6px}
#toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);max-width:92vw;background:#fff;color:#0e1a2b;font-weight:800;padding:10px 20px;border-radius:30px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;text-align:center}
#toast.on{opacity:1}

@media (orientation:landscape) and (min-width:700px){
  main{flex-direction:row}
  .ctl{flex:0 0 46%;overflow-y:auto;border-bottom:0;border-right:2px solid var(--line);justify-content:center;padding:12px}
  #timer{font-size:min(14vw,22dvh)}
  #goal{flex:1;height:auto;min-height:120px}
  #start,#reset{min-height:64px}
  .rec{font-size:17px}.rec .tm{font-size:20px}
}
@media (max-width:360px){.rec{font-size:13px}.pi .t{font-size:22px}}
</style>
</head>
<body>
<header>
  <div class="evwrap">
    <label for="event">本日の種目</label>
    <input id="event" list="events" value="50m走" autocomplete="off">
    <datalist id="events"><option value="50m走"><option value="100m走"><option value="走幅跳"><option value="リレー"><option value="1000m走"><option value="持久走"><option value="シャトルラン"></datalist>
  </div>
  <button class="hb" id="bRoster">名簿登録</button>
  <button class="hb" id="bGas">GAS設定</button>
</header>

<main>
  <div class="ctl">
    <div id="timer">0.00</div>
    <div class="row">
      <button id="start" type="button">一斉スタート</button>
      <button id="reset" type="button">リセット</button>
    </div>
    <button id="goal" type="button" disabled>ゴール（タップ）</button>
  </div>

  <div class="log" id="log">
    <div class="h2row"><h2>計測したタイム</h2><button id="clearPending" type="button">未登録を全消去</button></div>
    <div id="pending"></div>

    <h2>過去記録（<span id="cnt">0</span>件）<span id="sync" style="font-size:13px;color:var(--sub);font-weight:400;margin-left:6px"></span></h2>
    <div class="tools">
      <button id="copy" type="button">スプレッドシート用にコピー</button>
      <button id="clear" type="button">一括クリア</button>
    </div>
    <div id="list"></div>
  </div>
</main>

<div class="modal" id="mRoster"><div class="box">
  <h2>名簿登録</h2>
  <p>1行に1人、「出席番号 名前」で入力します（区切りは空白・タブ・カンマ）。例：1 山田太郎</p>
  <textarea id="rosterText" placeholder="1 山田太郎&#10;2 佐藤花子"></textarea>
  <div class="row"><button id="rCancel">閉じる</button><button id="rSave" style="background:var(--go);color:#04210f">名簿を保存</button></div>
</div></div>

<div class="modal" id="mGas"><div class="box">
  <h2>GAS設定</h2>
  <p>スプレッドシートに紐づけたGoogle Apps ScriptのWebアプリURLを貼り付けます。空欄なら送信しません。記録は必ずこの端末にも保存され、電波がない場合は復帰後に未送信分を再送します。</p>
  <input id="gasUrl" placeholder="https://script.google.com/macros/s/.../exec">
  <div class="row"><button id="gCancel">閉じる</button><button id="gSave" style="background:var(--go);color:#04210f">URLを保存</button></div>
</div></div>

<div class="modal" id="mAsk"><div class="box" id="askBox">
  <p id="askMsg"></p>
  <div class="row" id="askBtns"></div>
</div></div>
<div id="toast"></div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const LS={
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
};
let roster=LS.get('pe_roster',[]);
let records=LS.get('pe_records',[]);   // {id,date,event,no,name,time,sec,sent}
let pending=LS.get('pe_pending',[]);   // {id,ms}
let gasUrl=LS.get('pe_gas','');
$('event').value=LS.get('pe_event','50m走');

const pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),1800)}

/* アプリ内ダイアログ（confirm()が使えない環境でも動く） */
function ask(msg,btns){
  return new Promise(res=>{
    $('askMsg').textContent=msg;
    const box=$('askBtns');box.innerHTML='';
    const done=v=>{$('mAsk').classList.remove('on');res(v)};
    btns.forEach(([label,val,style])=>{
      const b=document.createElement('button');b.type='button';b.textContent=label;
      if(style)b.style.cssText=style;b.onclick=()=>done(val);box.appendChild(b);
    });
    $('mAsk').onpointerdown=e=>{if(e.target===$('mAsk'))done(btns[0][1])};
    $('mAsk').classList.add('on');
  });
}

/* ---- 表示形式の自動切り替え ---- */
function isLong(ev){
  ev=(ev||'').normalize('NFKC');
  if(/リレー|長距離|持久|シャトル|マラソン|駅伝|分/.test(ev))return true;
  const m=ev.match(/(\d+(?:\.\d+)?)\s*(km|m|メートル)/i);
  if(m){const v=m[2].toLowerCase()==='km'?m[1]*1000:+m[1];return v>=400}
  return false;
}
function fmt(ms,long){
  const cs=Math.floor(ms/10);
  if(long)return Math.floor(cs/6000)+':'+pad(Math.floor(cs%6000/100))+'.'+pad(cs%100);
  return Math.floor(cs/100)+'.'+pad(cs%100);
}
const curLong=()=>isLong($('event').value);

/* ---- タイマー ---- */
let isRunning=false,startTime=0,elapsed=0,rafId=0;
function tick(){
  if(!isRunning)return;                       // 停止済みなら再スケジュールしない
  elapsed=performance.now()-startTime;
  $('timer').textContent=fmt(elapsed,curLong());
  rafId=requestAnimationFrame(tick);
}
function startTimer(){
  if(isRunning)return;
  isRunning=true;startTime=performance.now();elapsed=0;
  $('timer').classList.add('run');$('goal').disabled=false;$('start').disabled=true;
  rafId=requestAnimationFrame(tick);
}
/* 確実なリセット：①ループ停止 ②変数を0 ③表示を初期化 ④フラグfalse */
function resetTimer(){
  isRunning=false;
  if(rafId){cancelAnimationFrame(rafId);rafId=0}
  startTime=0;elapsed=0;
  $('timer').textContent=fmt(0,curLong());
  $('timer').classList.remove('run');
  $('goal').disabled=true;$('start').disabled=false;
}
function goal(){
  if(!isRunning)return;
  const ms=performance.now()-startTime;
  pending.push({id:Date.now()+'-'+Math.random().toString(36).slice(2,6),ms});
  LS.set('pe_pending',pending);renderPending();
  if(navigator.vibrate)navigator.vibrate(30);
  $('log').scrollTop=0;
}
function clearPending(){pending=[];LS.set('pe_pending',pending);renderPending()}

$('start').onclick=startTimer;
$('reset').onclick=async()=>{
  resetTimer();                               // まずタイマーを必ず初期化（確認なし）
  if(pending.length){                         // そのあと未登録タイムの扱いだけ確認
    const c=await ask(`タイマーをリセットしました。未登録のタイムが${pending.length}件あります。`,
      [['残す','keep'],['消去する','clear','background:var(--stop)']]);
    if(c==='clear'){clearPending();toast('未登録のタイムを消去しました')}
  }
};
$('clearPending').onclick=async()=>{
  if(!pending.length){toast('未登録のタイムはありません');return}
  const c=await ask(`未登録のタイム${pending.length}件を消去しますか？`,[['やめる','no'],['消去する','yes','background:var(--stop)']]);
  if(c==='yes')clearPending();
};
$('goal').addEventListener('pointerdown',e=>{e.preventDefault();goal()});
document.addEventListener('keydown',e=>{
  if(e.code==='Space'&&!/INPUT|SELECT|TEXTAREA|BUTTON/.test(e.target.tagName)){e.preventDefault();isRunning?goal():startTimer()}
});

/* ---- 一時タイムカード ---- */
const opts=()=>'<option value="">番号・名前を選択</option>'+roster.map((r,i)=>`<option value="${i}">${esc(r.no)}　${esc(r.name)}</option>`).join('');
function renderPending(){
  const box=$('pending'),long=curLong();
  const keep={};box.querySelectorAll('.pi').forEach(c=>keep[c.dataset.id]=c.querySelector('select').value);
  if(!pending.length){box.innerHTML='<div class="empty">ゴールをタップすると、ここにタイムが並びます</div>';return}
  box.innerHTML=pending.map((p,i)=>`<div class="pi" data-id="${p.id}">
    <span class="o">【${i+1}】</span><span class="t">${fmt(p.ms,long)}</span>
    <select>${opts()}</select>
    <button class="reg" type="button">登録</button>
    <button class="x" type="button" aria-label="このタイムを削除">×</button></div>`).join('');
  box.querySelectorAll('.pi').forEach(c=>{const v=keep[c.dataset.id];if(v)c.querySelector('select').value=v});
}
$('pending').addEventListener('click',e=>{
  const row=e.target.closest('.pi');if(!row)return;
  const p=pending.find(x=>x.id===row.dataset.id);if(!p)return;
  if(e.target.classList.contains('x')){
    pending=pending.filter(x=>x!==p);LS.set('pe_pending',pending);renderPending();return;
  }
  if(e.target.classList.contains('reg')){
    const v=row.querySelector('select').value;
    if(v===''){toast(roster.length?'児童を選んでください':'先に名簿を登録してください');return}
    const r=roster[+v],d=new Date(),long=curLong();
    const rec={id:p.id,date:pad(d.getMonth()+1)+'/'+pad(d.getDate()),event:$('event').value.trim()||'未設定',
      no:r.no,name:r.name,time:fmt(p.ms,long),sec:(Math.floor(p.ms/10)/100).toFixed(2),sent:false};
    records.push(rec);
    pending=pending.filter(x=>x!==p);
    LS.set('pe_records',records);LS.set('pe_pending',pending);
    renderPending();renderRecords();flush();
  }
});

/* ---- 過去記録 ---- */
function renderRecords(){
  $('cnt').textContent=records.length;
  if(!records.length){$('list').innerHTML='<div class="empty">まだ記録がありません</div>';updSync();return}
  $('list').innerHTML='<div class="rec h"><span>日時</span><span>種目</span><span>番号</span><span>児童名</span><span style="text-align:right">タイム</span><span></span></div>'+
    records.map(r=>`<div class="rec${r.sent?'':' un'}"><span>${esc(r.date)}</span><span>${esc(r.event)}</span><span>${esc(r.no)}</span><span>${esc(r.name)}</span><span class="tm">${esc(r.time)}</span><button type="button" data-id="${r.id}" aria-label="削除">×</button></div>`).join('');
  updSync();
}
$('list').addEventListener('click',async e=>{
  const id=e.target.dataset&&e.target.dataset.id;if(!id)return;
  const c=await ask('この記録を削除しますか？（スプレッドシート側は消えません）',[['やめる','no'],['削除する','yes','background:var(--stop)']]);
  if(c==='yes'){records=records.filter(r=>r.id!==id);LS.set('pe_records',records);renderRecords()}
});
$('clear').onclick=async()=>{
  if(!records.length)return;
  const c=await ask('この端末の過去記録をすべて消去します。よろしいですか？',[['やめる','no'],['すべて消去','yes','background:var(--stop)']]);
  if(c==='yes'){records=[];LS.set('pe_records',records);renderRecords()}
};
$('copy').onclick=async()=>{
  if(!records.length){toast('コピーする記録がありません');return}
  const tsv=records.map(r=>[r.date,r.event,r.no,r.name,r.time].join('\t')).join('\n');
  try{await navigator.clipboard.writeText(tsv)}
  catch(e){
    const ta=document.createElement('textarea');ta.value=tsv;document.body.appendChild(ta);ta.select();
    let ok=false;try{ok=document.execCommand('copy')}catch(_){}
    ta.remove();if(!ok){toast('コピーに失敗しました');return}
  }
  toast(records.length+'件をコピーしました。貼り付けできます');
};

/* ---- GAS送信（GET）＋オフライン再送 ---- */
let flushing=false;
function updSync(){
  const s=$('sync');
  if(!gasUrl){s.textContent='（GAS未設定・端末に保存中）';s.style.color='var(--sub)';return}
  const n=records.filter(r=>!r.sent).length;
  s.textContent=n?`（未送信 ${n}件）`:'（送信済み）';
  s.style.color=n?'var(--goal)':'var(--go)';
}
async function flush(){
  if(!gasUrl||flushing){updSync();return}
  flushing=true;
  try{
    for(const rec of records.filter(r=>!r.sent)){
      const appData={id:rec.id,date:rec.date,event:rec.event,no:rec.no,name:rec.name,time:rec.time,sec:rec.sec};
      try{
        await fetch(gasUrl+'?data='+encodeURIComponent(JSON.stringify(appData)),{method:'GET',mode:'no-cors'});
        rec.sent=true;LS.set('pe_records',records);renderRecords();
      }catch(err){console.error(err);break}
    }
  }finally{flushing=false;updSync()}
}
window.addEventListener('online',flush);

/* ---- モーダル ---- */
const open=id=>$(id).classList.add('on'),close=id=>$(id).classList.remove('on');
$('bRoster').onclick=()=>{$('rosterText').value=roster.map(r=>r.no+' '+r.name).join('\n');open('mRoster')};
$('rCancel').onclick=()=>close('mRoster');
$('rSave').onclick=()=>{
  roster=$('rosterText').value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{
    const m=l.match(/^(\S+?)[\s,，、]+(.+)$/);return m?{no:m[1],name:m[2].trim()}:null;
  }).filter(Boolean);
  LS.set('pe_roster',roster);renderPending();close('mRoster');toast(roster.length+'名を登録しました');
};
$('bGas').onclick=()=>{$('gasUrl').value=gasUrl;open('mGas')};
$('gCancel').onclick=()=>close('mGas');
$('gSave').onclick=()=>{
  gasUrl=$('gasUrl').value.trim();LS.set('pe_gas',gasUrl);close('mGas');
  toast(gasUrl?'保存しました':'GAS送信をオフにしました');renderRecords();flush();
};
['mRoster','mGas'].forEach(id=>$(id).addEventListener('pointerdown',e=>{if(e.target===$(id))close(id)}));

/* ---- 種目変更 ---- */
$('event').addEventListener('input',()=>{
  LS.set('pe_event',$('event').value);
  if(!isRunning)$('timer').textContent=fmt(0,curLong());
  renderPending();
});

/* ---- 初期化 ---- */
resetTimer();
renderPending();renderRecords();flush();
})();
</script>
</body>
</html>
